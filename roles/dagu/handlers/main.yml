---
# Dagu handlers

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes
  become: yes

- name: restart dagu
  block:
    - name: Stop dagu service
      ansible.builtin.systemd:
        name: dagu
        state: stopped
      become: yes

    - name: Wait for coordinator port to be released
      ansible.builtin.wait_for:
        port: "{{ dagu_coordinator_port | default(50051) }}"
        state: stopped
        timeout: 30
      when: dagu_distributed_mode == 'coordinator'
      ignore_errors: yes

    - name: Start dagu service
      ansible.builtin.systemd:
        name: dagu
        state: started
      become: yes
